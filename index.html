    <title>Janaka Vithanage</title>
    <script type="module" src="src/react/main.jsx"></script>

  </head>

  <body>
    <div class="socials-desktop" id="socials-desktop-root"></div>
    <div id="react-root"></div>
    <header id="header"></header>
    <main class="main">
      <div id="hero-root"></div>
      <div id="about-root"></div>
      <div id="skills-root"></div>
      <div id="career-root"></div>
      <div id="portfolio-root"></div>
      <div class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="contact-title" tabindex="-1">
        <div class="modal-dialog hidden">
          <div class="modal__header">
            <h2 id="contact-title" class="stroke-left modal__title">Let's work together</h2>
            <button class="modal__close" type="button" aria-label="Close contact form"></button>
          </div>
          <div class="modal__body">
            <form
              class="contact-form"
              id="contact-form"
              action="/api/send-email"
              method="post"
              name="Contact Janaka Vithanage"
              data-recaptcha-site-key="6LeLGbwmAAAAAK2z7ZzW_hDef9Ll9RI2RCf0RglP"
            >
              <input
                type="hidden"
                id="g-recaptcha-response"
                name="g-recaptcha-response"
              />
              <!-- Honeypot (leave empty) -->
              <input
                type="text"
                id="website"
                name="website"
                tabindex="-1"
                autocomplete="off"
                aria-hidden="true"
                style="position:absolute; left:-10000px; top:auto; width:1px; height:1px; overflow:hidden;"
              />
              <!-- Timestamp when form opened for time-to-submit check -->
              <input type="hidden" id="form-started-at" name="form-started-at" />
              <p class="form-status hidden">This is the form status</p>
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Your Name"
                class="form-input"
                required
              />
              <div class="input-group">
                <input
                  type="email"
                  name="email"
                  id="email"
                  placeholder="Email Address"
                  class="form-input"
                  required
                />
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  placeholder="Phone Number"
                  class="form-input"
                  required
                />
              </div>
              <input
                type="text"
                id="subject"
                name="subject"
                placeholder="Subject"
                class="form-input"
                required
              />
              <textarea
                name="message"
                name="message"
                id="message"
                placeholder="Message"
                class="form-textarea"
                required
              ></textarea>
              <button type="submit" class="btn btn-lg btn-black btn-form">
                Send Messsage
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>
    <div id="callout-root"></div>
    <div id="footer-root"></div>
  </body>
